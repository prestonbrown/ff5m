## Served to moonraker as mod_data/platform.moonraker.conf on boards with no
## .cfg.$PLATFORM/moonraker.conf of their own. Carries the update entries
## that name AD5M rootfs paths, moved verbatim out of the shared moonraker.conf:
## on a board whose rootfs lacks the path, the extension fails to load and its
## unconsumed options surface as warnings.

[update_manager guppyscreen]
type: zip
channel: stable
path: /root/guppyscreen
repo: DrA1ex/guppyscreen
managed_services: guppyscreen
