##
## AD5X override for .cfg/init.base.cfg. Removes [heater_bed] (relocated to
## printer.cfg by init.move.cfg) and the stock [led chamber_led]. Unlike the
## AD5M version it does NOT strip [fan_generic pcb_fan] nor add
## [controller_fan driver_fan] - AD5X keeps its stock pcb_fan (PA5).
##
-[heater_bed]
-[led chamber_led]

# AD5X's klippy (Sep 2025, near-mainline) deprecates max_accel_to_decel in
# favour of minimum_cruise_ratio; the AD5M's older klippy rejects the new
# option outright, so this pair lives only in the AD5X overlay. Both halves or
# neither: removing the option alone leaves klipper's default ratio of 0.5,
# silently doubling the effective accel-to-decel, and adding the ratio while
# the option is still present is a hard startup error. The value rides in
# data.init.base.cfg: 0.75 = 1 - min(1, 5000/20000), the stock behaviour.
- [printer] max_accel_to_decel
[printer] minimum_cruise_ratio

# The toolhead filament sensor's ADC, which [ifs_toolhead_sensor toolhead] in
# macros/hw_base.ad5x.cfg claims directly instead. Stock declares eboard:PA3 as
# a thermistor purely so klipper samples the pin, and klipper reports a
# thermistor every 0.300s (adc_temperature.REPORT_TIME). That is fine for
# temperature and coarse for a filament tip: at the 3600 mm/min retract it is
# 18mm of travel between looks, against a transition zone measured at 5-10mm.
# Claiming the pin gets a sample every 0.015s instead. A pin can only be
# claimed once, so the stock section has to go for the claim to succeed.
#
# Both halves or neither. This removal WITHOUT the sensor_pin over there
# leaves nothing sampling PA3 at all: the sensor reads None, which costs
# runout detection and load confirmation. The reverse - sensor_pin without
# this removal - is survivable, because the plugin logs a warning and falls
# back to the slow reading rather than refusing to boot. That is what makes a
# firmware update restoring printer.base.cfg cost precision, not the machine.
#
# [temperature_sensor cutValue] sits immediately after this section in the
# stock file and is NOT removed; nothing here reads it, but the cutter's ADC
# is not ours to take.
-[temperature_sensor filamentValue]
