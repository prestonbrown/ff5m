##
## AD5X override for .cfg/init.base.cfg. Removes [heater_bed] (relocated to
## printer.cfg by init.move.cfg) and the stock [led chamber_led]. Unlike the
## AD5M version it does NOT strip [fan_generic pcb_fan] nor add
## [controller_fan driver_fan] - AD5X keeps its stock pcb_fan (PA5).
##
-[heater_bed]
-[led chamber_led]

# AD5X's klippy (Sep 2025, near-mainline) deprecates max_accel_to_decel in
# favour of minimum_cruise_ratio; the AD5M's older klippy rejects the new
# option outright, so this pair lives only in the AD5X overlay. Both halves or
# neither: removing the option alone leaves klipper's default ratio of 0.5,
# silently doubling the effective accel-to-decel, and adding the ratio while
# the option is still present is a hard startup error. The value rides in
# data.init.base.cfg: 0.75 = 1 - min(1, 5000/20000), the stock behaviour.
- [printer] max_accel_to_decel
[printer] minimum_cruise_ratio
