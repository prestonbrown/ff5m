##
## AD5X override for .cfg/data.init.base.cfg. Carries the values for the
## parameter additions init.base.cfg declares: the [printer] accel pair, whose
## option swap (max_accel_to_decel -> minimum_cruise_ratio) is spelled out
## there. The AD5M seeds a [controller_fan driver_fan] here; the AD5X keeps
## its stock pcb_fan and adds nothing of the kind.
##
[printer]
minimum_cruise_ratio: 0.75
