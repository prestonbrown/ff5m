## AD5X override for .cfg/init.cfg. Same move set as the shared file, except:
## the shared [led chamber_light] ADD becomes a STRIP - the AD5X is an
## open-frame machine and no chamber light is fitted (the enclosure kit does
## not carry one either) - and [fan_generic chamber_fan] is ADDED: the
## enclosure kit's circulation fan header is wired to PB7 and present on the
## mainboard whether or not the fan itself is, so declaring it is safe and
## makes the AIR_CIRCULATION macros work on machines that have the fan.
##
-[include ./mod/switch_sensor.cfg]
-[include ./mod/motion_sensor.cfg]
-[include check_md5.cfg]
-[include ./mod/switch_sensor_display_off.cfg]
-[include ./mod/display_off.cfg]
-[include ./mod/mod.cfg]
-[led chamber_light]
[fan_generic chamber_fan]
[skew_correction]
