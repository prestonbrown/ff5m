## AD5X override for .cfg/init.cfg. Same move set as the shared file, except:
## [led chamber_light] stays, pointed at the factory's own PA11 (the factory
## config declares the chamber LED live on that pin, unlike the optional-fit
## fans it ships commented - open-frame machines carry no light, the header
## is wired regardless, and driving an unconnected pin is harmless), and
## [fan_generic chamber_fan] is ADDED: the enclosure kit's circulation fan
## header is wired to PB7 and present on the mainboard whether or not the fan
## itself is, so declaring it is safe and makes the AIR_CIRCULATION macros
## work on machines that have the fan.
##
-[include ./mod/switch_sensor.cfg]
-[include ./mod/motion_sensor.cfg]
-[include check_md5.cfg]
-[include ./mod/switch_sensor_display_off.cfg]
-[include ./mod/display_off.cfg]
-[include ./mod/mod.cfg]
[led chamber_light]
[fan_generic chamber_fan]
[skew_correction]
