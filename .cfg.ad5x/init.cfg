## AD5X override for .cfg/init.cfg. Same move set as the shared file, except:
## the shared [led chamber_light] ADD becomes a STRIP - this machine's stock
## config ships no led section, so a transplant-side led would land after the
## mod includes where nothing can use it at parse time, and the led the mod
## actually drives is declared in macros/hw_base.ad5x.cfg (factory pin PA11)
## together with its SET_LED wrapper. [fan_generic chamber_fan] is ADDED:
## the enclosure kit's circulation fan header is wired to PB7 and present on
## the mainboard whether or not the fan itself is, so declaring it is safe
## and makes the AIR_CIRCULATION macros work on machines that have the fan.
##
-[include ./mod/switch_sensor.cfg]
-[include ./mod/motion_sensor.cfg]
-[include check_md5.cfg]
-[include ./mod/switch_sensor_display_off.cfg]
-[include ./mod/display_off.cfg]
-[include ./mod/mod.cfg]
-[led chamber_light]
[fan_generic chamber_fan]
[skew_correction]
