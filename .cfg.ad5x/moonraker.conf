##
## Served to moonraker as mod_data/platform.moonraker.conf on the AD5X. The
## AD5M carries its guppyscreen entry in .cfg/moonraker.conf; this rootfs has
## no /root/guppyscreen, so the entry would only warn here.

# klippy runs on the host and reports host spellings (/usr/data/config); this
# moonraker runs in the chroot, whose resolve() of those paths never equals
# the symlinked printer_data/config, so the not-in-config-folder warning can
# not be satisfied by any link. Moonraker's documented escape hatch applies.
# On the AD5M host and chroot spellings coincide and the check stays on.
[file_manager]
check_klipper_config_path: False
