##
## AD5X override for .cfg/data.init.cfg. The shared [led chamber_light] body
## is gone with the section itself (init.cfg above strips it: the led this
## machine's macros drive is declared in macros/hw_base.ad5x.cfg, on the
## factory's PA11, beside its SET_LED wrapper). What stays is the enclosure
## kit's circulation fan on PB7 - cycle_time matches the one known-working
## configuration of that header.
##
[fan_generic chamber_fan]
pin: PB7
cycle_time: 0.001

[skew_correction]
