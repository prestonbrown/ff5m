## AD5X override for .cfg/data.init.cfg. Body restored into printer.cfg for
## the shared init.cfg [led chamber_light] ADD. AD5X drives the chamber LED
## on PA11 (its stock [led chamber_led] pin), not the AD5M's PA8.
##
[led chamber_light]
white_pin: PA11
hardware_pwm: False
cycle_time: 0.002

[skew_correction]
