##
## AD5X override for .cfg/data.init.cfg. The shared [led chamber_light] body
## is replaced with the factory's own declaration: white LED on PA11, no
## hardware PWM (factory printer.base.cfg ships exactly this, uncommented -
## unlike the optional-fit fans). No light is fitted on an open-frame machine,
## but the header is wired, so enclosure-kit machines get their light and
## SET_LED drives the real pin on every machine. The enclosure kit's
## circulation fan on PB7 follows - cycle_time matches the one known-working
## configuration of that header.
##
[led chamber_light]
white_pin: PA11
hardware_pwm: False

[fan_generic chamber_fan]
pin: PB7
cycle_time: 0.001

[skew_correction]
