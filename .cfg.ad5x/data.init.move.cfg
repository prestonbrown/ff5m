##
## AD5X override for .cfg/data.init.move.cfg. Fallback [heater_bed] used only
## if the step-1 live extract from printer.base.cfg fails. AD5X stock bed
## thermistor is on PA0 (AD5M: PC3); max_power capped at 0.4.
##
[heater_bed]
heater_pin: PB9
sensor_type: Generic 3950
sensor_pin: PA0
pullup_resistor: 4700
control: pid
pid_Kp: 32.79
pid_Ki: 4.970
pid_Kd: 54.118
max_power: 0.4
min_temp: -100
max_temp: 130
