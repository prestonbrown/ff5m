##
## The IFS Jacker (https://github.com/ninjamida/ifs-jacker) sits between the
## host and the IFS board. Declare this section only on a machine that has
## one; on a plain IFS the probe is silent-capped and harmless, but there is
## no reason to ask. Requires [ifs].
##
## Detection, peripheral state and the IFSJ_Z* commands all live in the
## plugin; this section is configuration only.
##
##   probe_delay:     seconds after startup before the first detection probe
##                    (default 30 - lets the IFS connect first)
##   probe_attempts:  silent probes before giving up until the link returns
##                    (default 3)
[ifs_jacker]
