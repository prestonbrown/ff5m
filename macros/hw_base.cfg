##
## AD5M-stock hardware sections, split out so other boards can override
## them. This is the AD5M default: a plain checkout loads exactly what it
## did before. base.cfg pulls it in via [include hw_base.cfg].
##

[temperature_sensor weightValue]
trigger_value: 1000
throttle: 10
reschedule: False
exceed_gcode:
    {% set weight_check = printer.mod_params.variables.weight_check %}
    {% set weight_check_max = printer.mod_params.variables.weight_check_max %}

    {% if weight_check %}
        RESPOND type="error" MSG="Bed pressure detected: {value} g."

        {% if value >= weight_check_max %}
            ALARM

            {% if printer.idle_timeout.state == "Printing" %}
                M112
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro G17]
gcode:
    _G17

[gcode_macro G18]
gcode:
    _G17

[gcode_macro G19]
gcode:
    _G17

## [load_cell_tare] — extracted from base.cfg. Its plugin (load_cell_tare.py)
## registers a klippy:ready handler that looks up [temperature_sensor
## weightValue] and [gcode_button check_level_pin], both AD5M-only. Keeping
## the section here (AD5M default) loads the plugin as before; the AD5X
## override omits it so the plugin never loads.
[load_cell_tare]

## SET_LED wrapper — extracted from base.cfg. The stock AD5M application
## addresses its chamber light as chamber_led; this translates that name onto
## the mod's chamber_light, honoring disable_screen_led. It lives in the
## platform file because rename_existing needs the chamber led to exist by
## parse time: the AD5M's own config defines it before the mod loads, and a
## machine whose config defines no led at all (the AD5X, whose stock config
## ships none) would refuse the rename and die at startup.
[gcode_macro SET_LED]
rename_existing: _SET_LED
gcode:
    {% if params.LED == "chamber_led" %}
        {% set disable_screen_led = printer.mod_params.variables.disable_screen_led %}
        {% if not disable_screen_led %}
            _SET_LED LED=chamber_light WHITE="{params.WHITE}" SYNC=0
        {% endif %}
    {% else %}
        _SET_LED {% for p in params %} {'%s=%s ' % (p, params[p])} {% endfor %}
    {% endif %}
