##
## AD5X override for hw_base.cfg. AD5X stock hardware omits the AD5M
## sections:
##   - [temperature_sensor weightValue]: the stock config declares no sensor
##     for it, so the mod's own "load_cell_serial" type publishes weight from
##     the conditioning MCU's UART instead (section below).
##   - [gcode_macro G17/G18/G19]: AD5X's newer stock gcode_arcs.py already
##     registers G17/G18/G19, so redefining them collides.
##   - [load_cell_tare]: kept, on this board's serial transport. Only the
##     AD5M's pin backend looks up [gcode_button check_level_pin], and no
##     macro may shadow the command the plugin registers itself.
##
## The AD5X's 4-channel filament system lives in ifs.cfg - a self-contained
## module whose macros and plugins need nothing from this file.
##
## Chamber light: the factory declares a white LED on PA11 (uncommented,
## unlike its optional-fit fans). This machine's stock config ships no led
## section at all, so the shared macros would have nothing to drive and the
## SET_LED rename below would have nothing to wrap. Declaring it here puts
## the led and its wrapper in one file, in that order, with no dependency on
## where the transplant happens to place sections in printer.cfg. No light is
## fitted on an open-frame machine; the header is wired regardless, and the
## enclosure kit brings one.
[led chamber_light]
white_pin: PA11
hardware_pwm: False

[gcode_macro SET_LED]
rename_existing: _SET_LED
gcode:
    {% if params.LED == "chamber_led" %}
        {% set disable_screen_led = printer.mod_params.variables.disable_screen_led %}
        {% if not disable_screen_led %}
            _SET_LED LED=chamber_light WHITE="{params.WHITE}" SYNC=0
        {% endif %}
    {% else %}
        _SET_LED {% for p in params %} {'%s=%s ' % (p, params[p])} {% endfor %}
    {% endif %}


# The shared tare plugin, on this board's transport. Same section, same
# LOAD_CELL_TARE command, same five call sites in base.cfg - only the two verbs
# that differ are switched: the AD5M toggles the conditioning MCU's H1 line as
# a GPIO and reads weight from a temperature sensor, while this board sends the
# same H1 over a UART and asks for weight with H7. So there must be no
# LOAD_CELL_TARE macro in this file: the plugin registers that command itself.
#
# Why it has to run at all: klipper only sees the conditioning MCU's verdict as
# the digital !PB3 probe pin, and that MCU decides "triggered" against a stored
# zero which drifts. Measured at 140 g of standing offset with the nozzle in
# free air, which holds the pin triggered permanently - every probing move then
# fails with "Probe triggered prior to movement" before it moves, and no bed
# mesh can complete. Stock re-zeroes from its screen application before each
# leveling flow; nothing in klipper did.
#
# A tare and a saved Z offset are ONE calibration. Changing whether the cell is
# zeroed moves the plane the probe reports, so an offset captured under the old
# behaviour does not survive this - re-derive it once, through a path that
# tares, or the nozzle prints into the plate.
[load_cell_tare]
transport: serial


# The collision watchdog, fed. Forge-X's bed-collision protection is an
# exceed_gcode on [temperature_sensor weightValue], and on the AD5M an ADC
# pushes weight into it. This board's cell is in the toolhead behind the
# conditioning MCU's UART, so the tare plugin registers a "load_cell_serial"
# sensor type that polls H7 and publishes grams - grams in place of degrees,
# exactly the contract the patched temperature_sensor already enforces. The
# numbers sit above this board's own measured working forces: probing
# touches read ~800 g and the filament cutter's squeeze ~1640 g, so the alert
# starts at 1800 and the outright stop (weight_check_max, 2200 by default on
# this board) clears the cutter with margin while still catching a crash -
# a nozzle driven into the plate reads well past either. The AD5M's bed cell
# keeps the AD5M's numbers; a heavy model cannot false-stop a print here.
#
# Must stay below [load_cell_tare] in this file: klippy instantiates sections
# in file order, and the sensor type only exists once that section has loaded
# the plugin.
[temperature_sensor weightValue]
sensor_type: load_cell_serial
report_time: 1
trigger_value: 1800
throttle: 10
reschedule: False
exceed_gcode:
    {% set weight_check = printer.mod_params.variables.weight_check %}
    {% set weight_check_max = printer.mod_params.variables.weight_check_max %}

    {% if weight_check %}
        RESPOND PREFIX="//" MSG="Load cell: {value} g"
        RESPOND type="error" MSG="Nozzle collision with the build plate detected."

        {% if value >= weight_check_max %}
            ALARM

            {% if printer.idle_timeout.state == "Printing" %}
                M112
            {% endif %}
        {% endif %}
    {% endif %}

# One board-dependent default. The watchdog above protects this board's
# toolhead cell, so it ships on here; on the AD5M the cell weighs the bed and
# a heavy model can false-stop a print, so its default stays off. The overlay
# changes defaults only - a value stored in the variables file still wins, so
# an existing install keeps whatever it was set to.
[mod_params]
defaults_overlay: /opt/config/mod/mod_params.ad5x.json


##
## Air circulation on this machine: one fan, no damper.
##
## The shared AIR_CIRCULATION macros drive the AD5M's enclosure - internal and
## external fans plus a damper servo routing between them. The AD5X is
## open-frame stock; the enclosure kit brings one circulation fan on PB7 and
## no damper, so there is no path to route between. Both modes run that fan
## and say so; STOP stops it. On a machine without the kit the fan object
## drives an unconnected header and nothing happens.
##
## The overrides keep the shared command names and simply redefine them: a
## same-named [gcode_macro] section in this file merges with the shared one
## and the later body wins, which is the only way one macro overrides
## another. rename_existing cannot do it - it parks an existing BUILTIN
## command (TONE, M24, SET_LED below), and with a macro on both ends the
## merged section takes the rename path, the original never registers, and
## klippy dies at connect demanding a command nobody defined.
[gcode_macro AIR_CIRCULATION_INTERNAL]
description: Run the circulation fan (single fan, no damper on AD5X)
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1
    RESPOND PREFIX="info" MSG="AD5X: circulation fan on (no damper fitted)"

[gcode_macro AIR_CIRCULATION_EXTERNAL]
description: Run the circulation fan (single fan, no damper on AD5X)
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1
    RESPOND PREFIX="info" MSG="AD5X: circulation fan on (no damper fitted)"

[gcode_macro AIR_CIRCULATION_STOP]
description: Stop the circulation fan
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0


##
## The shared filament verbs drive the IFS lanes on this machine.
##
## config/material.cfg implements LOAD_FILAMENT/UNLOAD_FILAMENT/PURGE_FILAMENT
## as bare extruder moves - right for a machine whose filament already sits at
## the gear, wrong here, where loading means driving a lane to the hub and
## threading the toolhead. Every shared caller lands in the lane-aware path
## this way: M600's change prompt, LOAD_MATERIAL's action menu, slicer
## stop-gcode and typed gcode, none of which know an IFS is fitted.
## SLOT= passes through; without it the verbs act on the loaded slot, so a
## bare LOAD_FILAMENT re-threads the current lane instead of surprising the
## user with lane 1. SPEED= is accepted and ignored: lane speed is the board's
## own setting, not a per-call number. MATERIAL= names the slot's type before
## loading (IFS_SET_MATERIAL's TYPE=). Like the air macros above, each verb is
## a plain same-named redefinition - the merged section takes this body.
[gcode_macro LOAD_FILAMENT]
description: Load filament into the nozzle through the IFS lane. SLOT= TEMP= MATERIAL=
gcode:
    {% set slot = params.SLOT|default(printer.save_variables.variables.ifs_loaded|default(0)|int, true)|int %}
    {% if slot < 1 %}
        {action_raise_error("LOAD_FILAMENT needs SLOT= on this machine (nothing is currently loaded)")}
    {% endif %}
    {% if params.MATERIAL is defined %}
        IFS_SET_MATERIAL SLOT={slot} TYPE="{params.MATERIAL}"
    {% endif %}
    {% if params.TEMP is defined %}
        IFS_LOAD SLOT={slot} TEMP={params.TEMP|float}
    {% else %}
        IFS_LOAD SLOT={slot}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Take filament out of the nozzle; the lane stays threaded. TEMP=
gcode:
    {% if params.TEMP is defined %}
        IFS_UNLOAD TEMP={params.TEMP|float}
    {% else %}
        IFS_UNLOAD
    {% endif %}

[gcode_macro PURGE_FILAMENT]
description: Purge the loaded lane through the nozzle at the chute. TEMP=
gcode:
    {% if params.TEMP is defined %}
        IFS_PURGE TEMP={params.TEMP|float}
    {% else %}
        IFS_PURGE
    {% endif %}


##
## Frame overrides: the shared macros are written in the AD5M's frame.
##
## The AD5M is centre-origin - X and Y run -110..110 with the plate centred on
## 0,0 - and base.cfg's hardcoded coordinates are all in that frame. The AD5X
## is corner-origin: 0..220, front left at 0,0. Both machines carry the same
## 220x220 plate, so an AD5M -110 means "the plate's left edge" and reads 0
## here, but the numbers are not interchangeable. A shared macro that drives to
## X-20 lands 20mm off the left of this bed, at the X hard minimum, against the
## frame - which is what CLEAR_NOZZLE's park did, at 6000mm/min, the first time
## this machine was given a plain sliced print.
##
## Past the plate on this machine there is hardware: the filament cutter at the
## front left, the purge chute and the wiper pad along the back wall. So the
## envelope these overrides enforce is the PLATE, not the kinematic limits.
## Staying inside position_min/max is not the same as staying off the hardware,
## and the stations are reached only through ifs.cfg's routed macros.
##
## Each override below is a same-named redefinition or a duplicate section.
## Klipper parses with RawConfigParser(strict=False) (klippy/configfile.py), so
## a duplicate section merges option by option with the later value winning,
## and base.cfg includes this file last - so a section here beats base.cfg and
## its early includes. It cannot reach headless.cfg or client.cfg, which parse
## afterwards; parks defined there are retargeted at runtime from ifs.cfg.


## The bed screws, in this machine's frame: the shared +-94 about the plate's
## centre is 16 and 204 measured from its front left corner. The four
## screw*_name options carry over from base.cfg, which names them front and
## rear, left and right - readings that stay correct here.
##
## screw_thread is deliberately NOT set, so base.cfg's CW-M4 carries over. The
## nut measures 7mm across the flats, which is an M4; an M3 would be 5.5mm. The
## CW/CCW sense is a separate question and a family-wide one: following
## klipper's output grows every deviation while reversing it converges,
## measured from klippy.log on an AD5M and confirmed on this machine. Screens
## already compensate for that downstream, so flipping the string here alone
## would double-flip them and start telling users to turn the screw the wrong
## way. It wants fixing family-wide, in its own change, not as a side effect of
## moving four coordinates.
[screws_tilt_adjust]
screw1: 16, 16
screw2: 204, 16
screw3: 204, 204
screw4: 16, 204


## MOVE_SAFE's envelope is the plate. It is the clamp for client jog moves,
## SMART_PARK and the end-of-print park, so the AD5M's +-110 is that machine's
## plate rather than its axis limits. Left as inherited it hides the whole
## right and rear half of this bed and truncates the end park to the middle of
## the finished print; widened to the kinematic limits (-20..225, -20..232) it
## would instead let a clamped client move reach the cutter. Only the four
## bounds are restated - the shared gcode body and the Z options merge through.
[gcode_macro MOVE_SAFE]
variable_x_min: 0.0
variable_x_max: 220.0
variable_y_min: 0.0
variable_y_max: 220.0


## Mesh validation expands its probe points outward from the loaded mesh and
## bounds that expansion at the plate. This machine's mesh is configured
## 0..215, so with the AD5M's bounds the expansion produced -5, and a probe at
## X-5 Y-5 is a downward move alongside the filament cutter.
[gcode_macro _CHECK_BED_MESH]
variable_bed_min_x: 0.0
variable_bed_min_y: 0.0
variable_bed_max_x: 220.0
variable_bed_max_y: 220.0


## The nozzle clean is a different SHAPE here, not the same one moved.
##
## The shared routine is built around what an AD5M cannot do. That machine has
## nowhere to put molten plastic, so it cannot flush the nozzle at all; its only
## cleaning mechanism is mechanical, and the whole routine exists to serve it -
## probe a surface twice, interpolate a height between the two readings, then
## drag the nozzle across that surface at 0.15mm and finish at 0.05mm. The
## probes are not a safety check, they ARE the mechanism.
##
## This machine flushes: filament goes out through the nozzle into the purge
## chute, the part fan freezes the blob, the shake snaps it off into the bin and
## the rubber wiper takes the residue. Nothing in that chain needs to know how
## far away the bed is, which is why there is no probe here and no Z reference
## at all. Translated rather than replaced, the inherited routine would drag a
## hot nozzle at bed height straight across the middle of this machine's print
## surface, to do a job the wiper is sitting right there to do.
##
## Two consequences worth naming. The shared routine zeroes the gcode offset
## and relies on RESTORE_GCODE_STATE to put it back, which does not restore
## homing_origin - so it leaves the applied Z offset on the floor for whatever
## runs next. Nothing here touches the offset, so that cannot arise. And every
## move below is delegated to ifs.cfg's station macros, which own the rule that
## X is crossed before Y and never combined, because there is hardware on the
## back wall.
[gcode_macro CLEAR_NOZZLE]
description: Flush the nozzle into the chute and wipe it. EXTRUDER_TEMP= BED_TEMP=
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(230)|float %}
    {% set bed_temp = params.BED_TEMP|default(80)|float %}
    {% set cooldown_t = printer.mod_params.variables.clear_cooldown_temp %}
    {% set sensor = printer["filament_switch_sensor toolhead"] %}
    {% set loaded = sensor.filament_detected if sensor else True %}

    _CANCEL_DELAYED_COMMANDS
    _CONTEXT_BEGIN TYPE=nozzle_clean
    RESPOND PREFIX="info" MSG="Cleaning the nozzle at the chute {extruder_temp}/{bed_temp}"

    _HOME_IF_NEEDED
    _CONTEXT_STATE NAME=HEATING

    SAVE_GCODE_STATE NAME=_clear_nozzle

    # The mesh goes away for the clean and comes back after it, as it does on
    # the shared path: a loaded mesh would apply Z compensation to travel moves
    # that have nothing to do with the bed.
    {% set mesh = printer.bed_mesh.profile_name %}
    BED_MESH_CLEAR

    G90

    # Park before heating rather than after. Whatever is left in the nozzle
    # softens and drips as it comes up to temperature, and over the chute that
    # is where it belongs.
    _IFS_PARK_FOR_PURGE

    # Both heaters at once: the bed is the slow one, and holding the nozzle
    # set until after the bed has arrived doubles the wait for nothing. The
    # waits below re-issue the same targets; they only enforce.
    M140 S{bed_temp}
    M104 S{extruder_temp}
    _WAIT_TEMPERATURE CMD=M140 VALUE={bed_temp} BELOW=2 ABOVE=3
    _WAIT_TEMPERATURE CMD=M104 VALUE={extruder_temp} BELOW=2 ABOVE=3

    _CONTEXT_STATE NAME=CLEANING
    ## A start line that announced TOOLCHANGE=1 opens by swapping lanes,
    ## and the swap cuts the loaded filament as its first act - a flush
    ## here would be pushed out only to be severed with the rest. The hint
    ## is consumed on read, so a clean outside that start (a manual clean,
    ## bed screws) flushes like normal.
    {% set swap_coming = (printer["gcode_macro _START_PRINT"]|default({})).ztoolchange|default(False) %}
    SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=ztoolchange VALUE=0
    {% if loaded and not swap_coming %}
        # One pass, sized to carry the residue out - not a colour change.
        # The tip needs to be molten and wet at the nozzle before the mesh
        # probes with it, and that is all this flush is for.
        _IFS_PURGE FIRST_MM=10 SECOND_MM=0
    {% else %}
        # Nothing worth flushing: either nothing is at the toolhead (the
        # extruder would turn against air), or a swap is coming and the cut
        # that begins it discards whatever a flush would push. The residue
        # on the outside of the tip is what the shake and the wiper are for
        # either way.
        RESPOND PREFIX="info" MSG="Skipping the flush; wiping only"
        _IFS_SHAKE
        _IFS_WIPE
    {% endif %}

    # Park on the pad BEFORE cooling. Cooling wherever the purge left the
    # head dribbles the softening ooze into the gap between the wall and the
    # plate; parked on the rubber, the same ooze lands somewhere a wipe can
    # reach. The bead that freezes there comes off in the wipe below.
    _IFS_GOTO_STATION X={printer["gcode_macro _IFS_GEOMETRY"].wipe_x_mid}

    {% if cooldown_t < extruder_temp %}
        # Air across the block rather than time alone. Off again before the
        # tare: airflow shaking the cell while it is zeroed is noise the
        # calibration does not need.
        _IFS_PART_FAN S=255
        _WAIT_TEMPERATURE CMD=M104 VALUE={cooldown_t} BELOW=3 ABOVE=3
        _IFS_PART_FAN S=0
    {% endif %}

    _CONTEXT_STATE NAME=FINISHING

    # Scrape the bead that froze against the pad during the cooldown, so the
    # mesh probes with a clean tip. The wipe leaves the head forward of the
    # back edge.
    _IFS_WIPE

    # Callers clean in order to probe, so zero the cell on the way out, while
    # the head is parked clear of the bed and nothing is touching the nozzle.
    # The tare has to happen after the cooldown above, not before: the cell
    # reads differently hot, and the number that matters is the one it will
    # hold during the probing that follows.
    LOAD_CELL_TARE

    # Print start reads this latch to skip its own flush: leveling already
    # flushed at the chute, and a second flush before the purge line is
    # wasted time and filament.
    SET_GCODE_VARIABLE MACRO=_START_PRINT_CLEAN VARIABLE=clean_done VALUE=True

    {% if mesh != "" %}
        BED_MESH_PROFILE LOAD="{mesh}"
    {% endif %}
    RESTORE_GCODE_STATE NAME=_clear_nozzle
    _CONTEXT_END


## The heat soak waits over the chute. The shared park is X110 Y110, the AD5M's
## far corner and this machine's dead centre, so inherited it drools whatever
## is left in the nozzle onto the middle of the sheet the print is about to go
## on. There is a bin here, and _IFS_PARK_FOR_PURGE knows how to reach it.
##
## Worth knowing for later: the shared _START_PRINT deliberately holds the
## nozzle at its current temperature through the soak rather than driving it to
## the print temperature, because heating early over a plate means oozing onto
## it. Parked over a bin that reasoning no longer applies, so heating both at
## once becomes available here - as its own change, with its own measurement.
[gcode_macro _START_PRINT_PARK]
description: Wait out the heat soak over the purge chute
gcode:
    _IFS_PARK_FOR_PURGE


## The KAMP smart park is redefined to the chute on this board.
##
## The shared start parks KAMP prints beside the print area and then reheats
## the nozzle to print temperature right there. zmod survives that because a
## purge line follows and catches the ooze; this rig runs priming disabled,
## so nothing catches it and the soak drips onto the middle of the sheet the
## print is about to start on. There is a bin here, and _START_PRINT_PARK
## knows how to reach it. The name keeps the shared call site unedited; this
## board answers it differently.
[gcode_macro SMART_PARK]
description: Park at the chute - the reheat soak never waits over the sheet
gcode:
    _START_PRINT_PARK


## zmod's start unit, step for step: heat, tare, home - nothing waits.
##
## zmod (the source of truth for this board) tares and homes immediately and
## parks at the bin to heat: _PREPARE_PRINT's tare, M140, G28, then the clean
## parks at the chute and waits there. Nothing here waits on the bed, because
## the wait belongs to the clean - parked where a softening nozzle belongs -
## and the one tare that matters, the at-temperature one, happens inside it,
## in the frame the mesh that follows can use. Waiting here instead parks the
## head over the sheet for the whole climb, dripping onto the print surface.
##
## The latch clear: _START_PRINT_CLEAN consumes the clean-done latch below,
## and a cancelled start must not leak a previous run's state into the next
## one - that would skip a flush that was owed.
[gcode_macro _START_PRINT_HEAT_HOME]
description: Start the bed, tare, and home - the clean parks and waits
gcode:
    M140 S{params.BED_TEMP|float}   ; start bed heating
    SET_GCODE_VARIABLE MACRO=_START_PRINT_CLEAN VARIABLE=clean_done VALUE=False
    LOAD_CELL_TARE
    _HOME_IF_NEEDED


## zmod homes Z once per start, before the clean. The mesh probes in the
## clean's frame and the user offset lands after it (see _START_PRINT_CLEAN
## below), so there is nothing left to re-derive: re-homing after leveling
## was a seam of the inherited AD5M shape, and it goes along with the rest.
[gcode_macro _START_PRINT_REHOME]
description: No-op - zmod's start homes Z exactly once
gcode:


## The user's Z offset lands here, after the mesh - zmod's law.
##
## zmod applies the stored offset after heating and meshing, immediately
## before the first extrusion (LOAD_GCODE_OFFSET at the end of its start), so
## no travel, probe, or wipe of the start flow ever runs with the offset
## composed in - an offset applied before those moves composes into probe
## arithmetic and travel heights, which is precisely the stacking this
## placement exists to prevent. The shared start applies it early when
## load_zoffset is on; this board runs load_zoffset=0 for that reason, and
## the offset arrives here.
##
## The flush half: the leveling path already flushed at the chute inside
## CLEAR_NOZZLE, and flushing again before the purge line is the doubled
## purge. A print that loads a stored mesh never levels, so nothing flushed -
## that start still gets one. The flush delegates to _IFS_PURGE, which ends
## with the fan off, G92 E0, a shake and a wipe, and NO retract - a first
## extrusion that starts behind the pressure it needs shows up as a gap at
## the start of the first perimeter. CLEAR_NOZZLE sets the latch on its way
## out; _START_PRINT_HEAT_HOME clears it at the top of every start, and it is
## cleared again here so a manual invocation outside any start leaves it
## down.
[gcode_macro _START_PRINT_CLEAN]
description: Apply the Z offset late; flush only if nothing cleaned
variable_clean_done: False
gcode:
    LOAD_GCODE_OFFSET
    {% set cleaned = (printer["gcode_macro _START_PRINT_CLEAN"]|default({})).clean_done|default(False) %}
    SET_GCODE_VARIABLE MACRO=_START_PRINT_CLEAN VARIABLE=clean_done VALUE=False
    {% if not cleaned %}
        {% set sensor = printer["filament_switch_sensor toolhead"] %}
        {% set loaded = sensor.filament_detected if sensor else True %}
        {% if loaded %}
            # Shorter than a colour change: this only has to carry the residue out.
            _IFS_PURGE FIRST_MM=20 SECOND_MM=10
        {% endif %}
    {% endif %}


## The shared _CLEAR_NOZZLE is the drag itself - X-10 to X20 at Y107..111, at
## the height its two probes measured. On this machine those coordinates are
## the middle of the print surface. Same intent, different hardware: the wiper
## does it, and _IFS_WIPE already knows how to get there and back.
[gcode_macro _CLEAR_NOZZLE]
description: Wipe the nozzle on the pad
gcode:
    _IFS_WIPE


## The four purge lines, each the shared body with +110 on both axes - the
## whole difference between the two frames - so they draw the same line on the
## same part of the plate that they do on an AD5M. Left inherited they run at
## Y-110, ninety millimetres below this machine's position_min, so klipper
## refuses the move and the print dies at the purge. _CLEAR4 is worse than a
## refusal: its first moves are legal, so it purges 9mm of filament off the
## front of the plate before erroring on the third.
##
## Which of these is the default is a separate question from whether they are
## survivable, and is not settled here.
[gcode_macro _CLEAR1]
description: Cleaning like Orca do
gcode:
    {% set safe_z = printer.mod_params.variables.safe_z | float | abs %}
    G90
    M83
    G1 Z{safe_z} F6000
    G1 E-0.2 F800
    G1 X220 Y0 F6000
    G1 E2 F800
    G1 Y0 X165 Z0.25 F4800
    G1 X55 E8 F2400
    G1 Y0.4 F2400
    G1 X165 E5 F2400
    G1 Y0 X165 Z0.45 F4800
    G1 X55 E8 F2400
    G1 Y0.4 F2400
    G1 X165 E5 F2400
    G92 E0

[gcode_macro _CLEAR2]
description: Cleaning recommended by FlashForge community
gcode:
    {% set safe_z = printer.mod_params.variables.safe_z | float | abs %}
    G90
    M83
    G1 E-0.2 F800
    G1 X220 Y0 Z{safe_z} F6000
    G1 Z0.2 F1200
    G1 E2 F800
    G1 X130 E9 F1000
    G1 X50 E12.5 F1000
    G1 E-0.2 F800
    G92 E0

[gcode_macro _CLEAR3]
description: Variation of cleaning by FlashForge community
gcode:
    G90
    M83
    G1 Y0 X190 Z0.2 F4800
    G1 X130 E9 F1000 ; intro line
    G1 X50 E12.5 F1000 ; intro line
    G92 E0

[gcode_macro _CLEAR4]
description: Schrader clear code from top to bottom on the right
gcode:
    {% set safe_z = printer.mod_params.variables.safe_z | float | abs %}
    G90
    M83
    G1 Z{safe_z} F6000
    G1 E-1.5 F800
    G1 X220 Y151 F6000
    G1 E2 F800
    G1 Y151 Z0.2 F4800
    G1 Y71 E9 F1000 ; intro line
