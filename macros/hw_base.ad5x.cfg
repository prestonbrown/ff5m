##
## AD5X override for hw_base.cfg. AD5X stock hardware omits the AD5M
## sections:
##   - [temperature_sensor weightValue]: the AD5X has no load-cell/weight
##     temperature sensor (its load cell is a plain [probe]).
##   - [gcode_macro G17/G18/G19]: AD5X's newer stock gcode_arcs.py already
##     registers G17/G18/G19, so redefining them collides.
##   - [load_cell_tare]: the AD5M default hw_base.cfg carries this section;
##     its plugin looks up [temperature_sensor weightValue] and
##     [gcode_button check_level_pin] on klippy:ready, both AD5X-absent, so
##     the plugin would abort at ready. AD5X omits the section (plugin never
##     loads) and provides the no-op LOAD_CELL_TARE macro below instead.
##

# The AD5M load-cell tare plugin is not loaded on AD5X (no [load_cell_tare]
# section above). AD5X uses the stock !PB3 load-cell probe directly and its
# callers do their own probing, so LOAD_CELL_TARE has nothing to do here. This
# no-op keeps the shared CLEAR_NOZZLE / _CHECK_BED_MESH / _START_PRINT call
# sites working with no motion. It accepts and ignores any params the call
# sites pass.
[gcode_macro LOAD_CELL_TARE]
description: No-op on AD5X (stock !PB3 probe; callers probe directly)
gcode:
    # Intentionally empty: AD5X has no load-cell tare hardware.


##
## IFS - the AD5X's 4-channel filament system
##
## The primitives these call ([ifs] in klipper) each block until the board says
## the move worked, jammed, faulted or timed out. The choreography lives here,
## as macros, so it can be read, run and overridden from the console.
##
## Distances come from the printer's own settings, not from constants:
## printer.ifs.params is filled from Adventurer5M.json's Multicolour block.
##
## Run any step by hand:
##     IFS_STATUS
##     IFS_CLAMP CHANNEL=2
##     IFS_FEED CHANNEL=2 UNTIL=toolhead
##     IFS_STOP
##

[gcode_macro _IFS_PARK_FOR_PURGE]
description: Move somewhere it is safe to purge. Override this for your machine.
gcode:
    # DELIBERATELY EMPTY. Purging drops molten plastic wherever the nozzle is,
    # and the AD5X's purge chute position has not been established - zmod moves
    # to `_CLIENT_VARIABLE.custom_park_y`, but that is its own configuration
    # rather than a measured fact about this printer.
    #
    # Override with your own park move, e.g.
    #     [gcode_macro _IFS_PARK_FOR_PURGE]
    #     gcode:
    #         G90
    #         G1 Y{printer["gcode_macro _CLIENT_VARIABLE"].custom_park_y} F12000
    {action_respond_info("IFS: purging in place - override _IFS_PARK_FOR_PURGE to move first")}

[gcode_macro _IFS_PURGE]
description: Push filament through the nozzle to clear what was there before
gcode:
    {% set p = printer.ifs.params %}
    M83
    M106 S{p.first_fan|int}
    G1 E{p.first_purge_mm} F{p.first_purge_speed}
    M106 S{p.second_fan|int}
    G1 E{p.second_purge_mm} F{p.second_purge_speed}
    M400
    M106 S0

[gcode_macro IFS_LOAD]
description: Load filament from an IFS slot into the nozzle. SLOT= TEMP=
gcode:
    {% set slot = params.SLOT|int %}
    {% set ifs = printer.ifs %}
    {% set temp = params.TEMP|default(printer.extruder.target)|float %}

    {% if not ifs.connected %}
        {action_raise_error("IFS is not connected: %s" % (ifs.error or "no reason recorded"))}
    {% endif %}
    {% if slot not in ifs.loaded_channels %}
        # The board refuses to feed an empty lane anyway ("FFS not ready."),
        # but saying so here is clearer than a failed opcode.
        {action_raise_error("IFS slot %d has no filament" % slot)}
    {% endif %}
    {% if temp < 150 %}
        # min_extrude_temp is 0 on this printer, so klipper will NOT refuse a
        # cold extrude. Nothing below this macro enforces it.
        {action_raise_error("IFS_LOAD needs TEMP= (or a nozzle target); got %.0f" % temp)}
    {% endif %}

    RESPOND PREFIX="info" MSG="IFS: loading slot {slot}"
    M104 S{temp|int}
    _IFS_PARK_FOR_PURGE
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={(temp - 2)|int}

    IFS_CLAMP CHANNEL={slot}
    # One feed for the whole tube; the toolhead sensor ends it, so a lane that
    # is already part-fed does not overshoot.
    IFS_FEED CHANNEL={slot} UNTIL=toolhead
    IFS_STOP

    _IFS_PURGE
    IFS_RELEASE CHANNEL={slot}
    RESPOND PREFIX="info" MSG="IFS: slot {slot} loaded"

[gcode_macro IFS_UNLOAD]
description: Pull filament out of the nozzle and back into its slot. SLOT= TEMP=
gcode:
    {% set ifs = printer.ifs %}
    {% set slot = params.SLOT|default(ifs.active_channel)|int %}
    {% set p = ifs.params %}
    {% set temp = params.TEMP|default(printer.extruder.target)|float %}

    {% if slot < 1 %}
        {action_raise_error("IFS_UNLOAD needs SLOT= (nothing is currently active)")}
    {% endif %}
    {% if temp < 150 %}
        # Cold filament snaps off in the heatbreak instead of coming out.
        {action_raise_error("IFS_UNLOAD needs TEMP= (or a nozzle target); got %.0f" % temp)}
    {% endif %}

    RESPOND PREFIX="info" MSG="IFS: unloading slot {slot}"
    M104 S{temp|int}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={(temp - 2)|int}

    IFS_CLAMP CHANNEL={slot}
    # The extruder pulls it back off the toolhead sensor first, then the IFS
    # takes it the rest of the way home.
    M83
    G1 E-{p.unload_extruder_mm} F{p.unload_speed}
    M400
    IFS_RETRACT CHANNEL={slot} LENGTH={p.unload_ifs_mm} SPEED={p.unload_speed}
    IFS_STOP
    IFS_RELEASE CHANNEL={slot}
    RESPOND PREFIX="info" MSG="IFS: slot {slot} unloaded"

[gcode_macro IFS_SELECT]
description: Switch to a different IFS slot, unloading whatever is loaded. SLOT= TEMP=
gcode:
    {% set slot = params.SLOT|int %}
    {% set ifs = printer.ifs %}
    {% set current = ifs.active_channel|int %}
    {% set temp = params.TEMP|default(printer.extruder.target)|float %}

    {% if current == slot %}
        RESPOND PREFIX="info" MSG="IFS: slot {slot} is already selected"
    {% else %}
        {% if current >= 1 %}
            IFS_UNLOAD SLOT={current} TEMP={temp}
        {% endif %}
        IFS_LOAD SLOT={slot} TEMP={temp}
    {% endif %}
