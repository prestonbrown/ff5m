##
## AD5X override for hw_base.cfg. AD5X stock hardware omits the AD5M
## sections:
##   - [temperature_sensor weightValue]: the AD5X has no load-cell/weight
##     temperature sensor (its load cell is a plain [probe]).
##   - [gcode_macro G17/G18/G19]: AD5X's newer stock gcode_arcs.py already
##     registers G17/G18/G19, so redefining them collides.
##   - [load_cell_tare]: the AD5M default hw_base.cfg carries this section;
##     its plugin looks up [temperature_sensor weightValue] and
##     [gcode_button check_level_pin] on klippy:ready, both AD5X-absent, so
##     the plugin would abort at ready. AD5X omits the section (plugin never
##     loads) and provides the no-op LOAD_CELL_TARE macro below instead.
##
## The AD5X's 4-channel filament system lives in ifs.cfg - a self-contained
## module whose macros and plugins need nothing from this file.
##
## Chamber light: the factory declares a white LED on PA11 (uncommented,
## unlike its optional-fit fans). This machine's stock config ships no led
## section at all, so the shared macros would have nothing to drive and the
## SET_LED rename below would have nothing to wrap. Declaring it here puts
## the led and its wrapper in one file, in that order, with no dependency on
## where the transplant happens to place sections in printer.cfg. No light is
## fitted on an open-frame machine; the header is wired regardless, and the
## enclosure kit brings one.
[led chamber_light]
white_pin: PA11
hardware_pwm: False

[gcode_macro SET_LED]
rename_existing: _SET_LED
gcode:
    {% if params.LED == "chamber_led" %}
        {% set disable_screen_led = printer.mod_params.variables.disable_screen_led %}
        {% if not disable_screen_led %}
            _SET_LED LED=chamber_light WHITE="{params.WHITE}" SYNC=0
        {% endif %}
    {% else %}
        _SET_LED {% for p in params %} {'%s=%s ' % (p, params[p])} {% endfor %}
    {% endif %}


# The AD5M load-cell tare plugin is not loaded on AD5X (no [load_cell_tare]
# section above). AD5X uses the stock !PB3 load-cell probe directly and its
# callers do their own probing, so LOAD_CELL_TARE has nothing to do here. This
# no-op keeps the shared CLEAR_NOZZLE / _CHECK_BED_MESH / _START_PRINT call
# sites working with no motion. It accepts and ignores any params the call
# sites pass.
#
# The load cell's zero is not reachable from klippy on this machine: stock
# zeroes it from the screen app, which sends an H1 tare over /dev/ttyS7 to
# the conditioning MCU (querying H7 weight until it reads near zero) from the
# level flows and pre-print preparation - never at boot, and nothing in
# klipper touches that port. Drift beyond what those flows correct means
# booting stock once and running its leveling; a host helper could speak
# ttyS7 directly if that ever stops being acceptable.
[gcode_macro LOAD_CELL_TARE]
description: No-op on AD5X (stock !PB3 probe; callers probe directly)
gcode:
    # Intentionally empty: AD5X has no host-side load-cell tare hardware.


##
## Air circulation on this machine: one fan, no damper.
##
## The shared AIR_CIRCULATION macros drive the AD5M's enclosure - internal and
## external fans plus a damper servo routing between them. The AD5X is
## open-frame stock; the enclosure kit brings one circulation fan on PB7 and
## no damper, so there is no path to route between. Both modes run that fan
## and say so; STOP stops it. On a machine without the kit the fan object
## drives an unconnected header and nothing happens.
##
## The overrides keep the shared command names and simply redefine them: a
## same-named [gcode_macro] section in this file merges with the shared one
## and the later body wins, which is the only way one macro overrides
## another. rename_existing cannot do it - it parks an existing BUILTIN
## command (TONE, M24, SET_LED below), and with a macro on both ends the
## merged section takes the rename path, the original never registers, and
## klippy dies at connect demanding a command nobody defined.
[gcode_macro AIR_CIRCULATION_INTERNAL]
description: Run the circulation fan (single fan, no damper on AD5X)
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1
    RESPOND PREFIX="info" MSG="AD5X: circulation fan on (no damper fitted)"

[gcode_macro AIR_CIRCULATION_EXTERNAL]
description: Run the circulation fan (single fan, no damper on AD5X)
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1
    RESPOND PREFIX="info" MSG="AD5X: circulation fan on (no damper fitted)"

[gcode_macro AIR_CIRCULATION_STOP]
description: Stop the circulation fan
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0


##
## The shared filament verbs drive the IFS lanes on this machine.
##
## config/material.cfg implements LOAD_FILAMENT/UNLOAD_FILAMENT/PURGE_FILAMENT
## as bare extruder moves - right for a machine whose filament already sits at
## the gear, wrong here, where loading means driving a lane to the hub and
## threading the toolhead. Every shared caller lands in the lane-aware path
## this way: M600's change prompt, LOAD_MATERIAL's action menu, slicer
## stop-gcode and typed gcode, none of which know an IFS is fitted.
## SLOT= passes through; without it the verbs act on the loaded slot, so a
## bare LOAD_FILAMENT re-threads the current lane instead of surprising the
## user with lane 1. SPEED= is accepted and ignored: lane speed is the board's
## own setting, not a per-call number. MATERIAL= names the slot's type before
## loading (IFS_SET_MATERIAL's TYPE=). Like the air macros above, each verb is
## a plain same-named redefinition - the merged section takes this body.
[gcode_macro LOAD_FILAMENT]
description: Load filament into the nozzle through the IFS lane. SLOT= TEMP= MATERIAL=
gcode:
    {% set slot = params.SLOT|default(printer.save_variables.variables.ifs_loaded|default(0)|int, true)|int %}
    {% if slot < 1 %}
        {action_raise_error("LOAD_FILAMENT needs SLOT= on this machine (nothing is currently loaded)")}
    {% endif %}
    {% if params.MATERIAL is defined %}
        IFS_SET_MATERIAL SLOT={slot} TYPE="{params.MATERIAL}"
    {% endif %}
    {% if params.TEMP is defined %}
        IFS_LOAD SLOT={slot} TEMP={params.TEMP|float}
    {% else %}
        IFS_LOAD SLOT={slot}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Take filament out of the nozzle; the lane stays threaded. TEMP=
gcode:
    {% if params.TEMP is defined %}
        IFS_UNLOAD TEMP={params.TEMP|float}
    {% else %}
        IFS_UNLOAD
    {% endif %}

[gcode_macro PURGE_FILAMENT]
description: Purge the loaded lane through the nozzle at the chute. TEMP=
gcode:
    {% if params.TEMP is defined %}
        IFS_PURGE TEMP={params.TEMP|float}
    {% else %}
        IFS_PURGE
    {% endif %}


[include ifs.cfg]
