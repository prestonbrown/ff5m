##
## AD5X override for hw_base.cfg. AD5X stock hardware omits the AD5M
## sections:
##   - [temperature_sensor weightValue]: the AD5X has no load-cell/weight
##     temperature sensor (its load cell is a plain [probe]).
##   - [gcode_macro G17/G18/G19]: AD5X's newer stock gcode_arcs.py already
##     registers G17/G18/G19, so redefining them collides.
##   - [load_cell_tare]: the AD5M default hw_base.cfg carries this section;
##     its plugin looks up [temperature_sensor weightValue] and
##     [gcode_button check_level_pin] on klippy:ready, both AD5X-absent, so
##     the plugin would abort at ready. AD5X omits the section (plugin never
##     loads) and provides the no-op LOAD_CELL_TARE macro below instead.
##

# The AD5M load-cell tare plugin is not loaded on AD5X (no [load_cell_tare]
# section above). AD5X uses the stock !PB3 load-cell probe directly and its
# callers do their own probing, so LOAD_CELL_TARE has nothing to do here. This
# no-op keeps the shared CLEAR_NOZZLE / _CHECK_BED_MESH / _START_PRINT call
# sites working with no motion. It accepts and ignores any params the call
# sites pass.
[gcode_macro LOAD_CELL_TARE]
description: No-op on AD5X (stock !PB3 probe; callers probe directly)
gcode:
    # Intentionally empty: AD5X has no load-cell tare hardware.


##
## IFS - the AD5X's 4-channel filament system
##
## The primitives these call ([ifs] in klipper) each block until the board says
## the move worked, jammed, faulted or timed out. The choreography lives here,
## as macros, so it can be read, run and overridden from the console.
##
## Distances come from the printer's own settings, not from constants:
## printer.ifs.params is filled from Adventurer5M.json's Multicolour block.
##
## Run any step by hand:
##     IFS_STATUS
##     IFS_CLAMP CHANNEL=2
##     IFS_FEED CHANNEL=2 UNTIL=toolhead
##     IFS_STOP
##

##
## The IFS board itself. Every option has a default - /dev/ttyS4 at 115200,
## a 1s poll, and four channels until F19 reports the real count - so the bare
## section is the whole configuration. Declaring it is what makes klippy import
## the plugin at all; the files sit inert in extras until something names them.
##
## toolhead_sensor names the filament_switch_sensor that UNTIL=toolhead waits
## on. Without it a feed has nothing to end on, and IFS_FEED refuses to start
## rather than run the tube's full length into the extruder.
[ifs]
toolhead_sensor: toolhead

##
## Which lane is actually in the nozzle, across restarts.
##
## The board cannot answer this. Its `chan` field is the SELECTOR position -
## which lane the mechanism is parked at - and it reads 0 after a power cycle
## with filament still loaded, so using it meant IFS_SELECT would cheerfully
## load a second lane on top of the first. Forge-X has no stock config to
## read it from either, so the lane is recorded here.
[save_variables]
filename: /usr/data/config/ifs_variables.cfg

##
## What is IN each slot - type and colour - as opposed to whether a lane holds
## filament, which is [ifs]'s question and the board's to answer.
##
## This is a VIEW onto FlashForge's own Adventurer5M.json, not a second copy:
## the stock UI writes ffmType<n> and ffmColor<n> there, and reading the same
## file means a spool changed in the stock UI is the spool we think we have.
## It also means the answer survives pulling a lane out and putting it back,
## because none of it lives on the IFS board.
[ifs_materials]

##
## The toolhead filament sensor.
##
## Not an IFS device: an analog input on the extruder board (eboard:PA3) that
## stock printer.cfg declares as a thermistor purely so klipper samples the ADC.
## LOW means filament PRESENT. The measured values and the thresholds derived
## from them live in .py/klipper/plugins/ifs_sensor_logic.py; they are not
## restated here, because when they were, correcting the measurement left three
## copies disagreeing.
##
## Registers as a stock `filament_switch_sensor toolhead`, so Moonraker and
## anything already watching filament sensors sees it with no extra wiring.
[ifs_toolhead_sensor toolhead]
pause_on_runout: True

##
## The back edge carries three different Y values, and confusing them is how
## you hit the back wall. All three are real, and all three were measured:
##
##   safe_y     220.0   the furthest back X may travel across the machine
##   station_y  229.0   the chute and the wiper; entered slowly, in Y only
##   232.0              klipper's axis_maximum - the wall. Never a target.
##
## The chute and the wiper are the same Y and differ only in X: the chute at
## X 52.5, the wiper pad spanning X 65..78. Confirmed on the machine (arriving
## at the chute is what opens its blocker door).
##
[gcode_macro _IFS_GEOMETRY]
description: Where the AD5X's back-edge service stations are
variable_chute_x: 52.5
variable_wipe_x_lo: 65.0
variable_wipe_x_mid: 73.0
variable_wipe_x_hi: 78.0
variable_station_y: 229.0
variable_safe_y: 220.0
## How far an inserted lane may be threaded through its own bowden while
## another lane holds the shared path. Measured on this machine: the lane
## bowden runs ~600 mm end to end, so 500 stops well short of the hub.
variable_insert_advance_mm: 500.0
## The change-time lift. 5 mm clears the part on the way out; more reaches
## the back-wall hardware at the station entries.
variable_lift_dz: 5.0
gcode:
    # Variable holder. Retune a station without editing a motion macro:
    #     SET_GCODE_VARIABLE MACRO=_IFS_GEOMETRY VARIABLE=chute_x VALUE=53.0


[gcode_macro _IFS_GOTO_STATION]
description: Approach a back-edge station (X=) without clipping the back wall
gcode:
    # *** X BEFORE Y, AND THEY MUST NOT BE COMBINED. ***
    # There is hardware on the back wall. A single `G1 X.. Y..` interpolates
    # diagonally into it, so X is finished at a Y that is clear, and only then
    # does Y run back.
    {% set g = printer["gcode_macro _IFS_GEOMETRY"] %}
    {% set x = params.X | float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    # No Z move here. The change entry (IFS_SELECT) lifted 5 mm once: that
    # clears the part, and arriving at the back edge low keeps the Y entry
    # below the wall hardware. A relative lift here would also stack per
    # visit: chute, cutter, pad, chute.
    {% if printer.gcode_move.gcode_position.x != x %}
        # X may only cross the machine at a Y that clears the back wall.
        {% if printer.gcode_move.gcode_position.y > g.safe_y %}
            _IFS_LEAVE_PURGE
        {% endif %}
        G1 X{x} F12000
        M400
    {% endif %}
    # Only now go back, and go back slowly.
    G1 Y{g.station_y} F3000
    M400


[gcode_macro _IFS_PARK_FOR_PURGE]
description: Move the nozzle over the purge chute before purging
gcode:
    _IFS_GOTO_STATION X={printer["gcode_macro _IFS_GEOMETRY"].chute_x}


[gcode_macro _IFS_LEAVE_PURGE]
description: Come forward off the back edge so X is free to move again
gcode:
    G90
    G1 Y{printer["gcode_macro _IFS_GEOMETRY"].safe_y} F12000
    M400


[gcode_macro _IFS_SHAKE]
description: Snap the purge blob off against the chute, without extruding
gcode:
    # Out of the chute, back into it, out again. No extrusion - the point is
    # the sudden stop, which breaks the string off the
    # nozzle so it drops down the chute instead of being dragged onto the pad
    # for the wiper to smear around.
    #
    # Y only, and only between safe_y and station_y, so it never travels in X
    # while the head is behind safe_y.
    {% set g = printer["gcode_macro _IFS_GEOMETRY"] %}
    G90
    G1 Y{g.safe_y} F12000
    G1 Y{g.station_y} F3000
    G1 Y{g.safe_y} F12000
    M400


[gcode_macro _IFS_WIPE]
description: Drag the nozzle across the wiper pad
gcode:
    # The pad is a strip of rubber at
    # station_y spanning X 65..78, so the wipe is a sweep in X with Y held -
    # not a poke in Y. Entering at the far end and finishing there leaves the
    # nozzle clean on both directions of travel.
    {% set g = printer["gcode_macro _IFS_GEOMETRY"] %}
    _IFS_GOTO_STATION X={g.wipe_x_hi}
    G1 X{g.wipe_x_lo} F12000
    G1 X{g.wipe_x_mid}
    G1 X{g.wipe_x_lo}
    G1 X{g.wipe_x_mid}
    G1 X{g.wipe_x_lo}
    G1 X{g.wipe_x_hi}
    M400
    _IFS_LEAVE_PURGE


[gcode_macro _IFS_SENSOR_HOLD]
description: Mute the toolhead filament sensor across a deliberate extruder move
variable_was_enabled: 0
gcode:
    # The toolhead sensor here is declared with
    # pause_on_runout, so filament moving under our own command would otherwise
    # read as a runout and pause the print.
    #
    # Save-and-restore, not force-on: a sensor the operator had already
    # disabled must still be disabled afterwards.
    {% set on = 1 if printer["filament_switch_sensor toolhead"].enabled else 0 %}
    SET_GCODE_VARIABLE MACRO=_IFS_SENSOR_HOLD VARIABLE=was_enabled VALUE={on}
    {% if on %}
        SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE=0
    {% endif %}


[gcode_macro _IFS_SENSOR_RESUME]
description: Restore the toolhead filament sensor after _IFS_SENSOR_HOLD
gcode:
    {% if printer["gcode_macro _IFS_SENSOR_HOLD"].was_enabled %}
        SET_FILAMENT_SENSOR SENSOR=toolhead ENABLE=1
    {% endif %}


[gcode_macro _IFS_PURGE]
description: Push filament through the nozzle, driving the lane with it. SLOT= EXTRA=
gcode:
    # Two passes: the first with the lane still driving, the second with the
    # extruder alone.
    #
    # The first pass is the one that matters. The IFS CANNOT push filament past
    # a gripping extruder gear - it stalls against it, which is exactly what
    # "feed channel 1 failed: stalled" was with the filament held fast at the
    # gear. G1 is queued and returns immediately, so the IFS feed that follows
    # runs alongside it, same length and same speed, and the two drive the
    # filament through together.
    {% set slot = params.SLOT|default(0)|int %}
    {% set p = printer.ifs.params %}
    # Extra length for a material change, on top of each pass - it lands on
    # both. The caller works out whether the type changed; this macro spends it.
    {% set extra = params.EXTRA|default(0)|float %}
    {% set first = p.first_purge_mm + extra %}
    {% set second = p.second_purge_mm + extra %}
    M83
    G92 E0

    # Heal a mute leaked by an earlier failure: klipper macros have no finally,
    # so an error between hold and resume leaves the sensor off. Restoring
    # here means the next purge starts from a known state.
    _IFS_SENSOR_RESUME

    # Over the chute for EVERY pass. A pass that purges wherever the last wipe
    # left the head fires plastic onto the wiper pad - measured at X78.0
    # Y220.0, ON the pad, 26mm from the chute - and purging onto the wiper is
    # how the wiper stops being a wiper.
    _IFS_PARK_FOR_PURGE
    M106 S{p.first_fan|int}
    _IFS_SENSOR_HOLD
    G1 E{first} F{p.first_purge_speed}
    {% if slot %}
        # SLEEP=1, not a state wait: the extruder is driving this same filament,
        # so the lane's motion bit says nothing useful about a stall.
        IFS_FEED CHANNEL={slot} UNTIL=done SLEEP=1 LENGTH={first} SPEED={p.first_purge_speed}
        # The lane has done its job; everything after this is the extruder's.
        IFS_RELEASE CHANNEL={slot}
        IFS_STOP
    {% endif %}
    M400
    _IFS_SENSOR_RESUME
    # Freeze the tail before snapping it off: four seconds at full part fan,
    # then the bounce. A molten tail snapped off lands where it pleases -
    # strings parked in front of the chute; a frozen one breaks clean into it.
    M106 S255
    G4 P4000
    # Snap and wipe after EVERY pass, not just the last one: a first blob left
    # attached carries into the second pass and onto the wiper.
    _IFS_SHAKE
    _IFS_WIPE

    # Second pass, extruder only. _IFS_WIPE has just left the head at the pad,
    # so returning to the chute is part of the pass, not an optimisation to
    # skip.
    _IFS_PARK_FOR_PURGE
    M106 S{p.second_fan|int}
    _IFS_SENSOR_HOLD
    G1 E{second} F{p.second_purge_speed}
    M400
    _IFS_SENSOR_RESUME

    # Same freeze before the second snap-off - see the first pass.
    M106 S255
    G4 P4000
    M106 S0
    G92 E0
    _IFS_SHAKE
    # _IFS_WIPE travels to the pad and leaves the head clear of the back edge.
    _IFS_WIPE


[gcode_macro _IFS_CUT]
description: Shear the filament against the toolhead cutter
variable_cut_x: -2.5
variable_cut_y: -7.5
variable_clear_x: 20.0
gcode:
    # The AD5X shears filament by driving the toolhead into
    # a fixed blade off the front-left of the bed - which is why these are
    # NEGATIVE coordinates. Both are inside axis_minimum (-20, -20), so they are
    # reachable; they are not a mistake.
    #
    # Fast to the front corner, slow only for the shear. The blade contact
    # is the last stretch of X at the cutter's depth, so everything before it
    # is travel: X to the clear position and Y to the front at travel feeds,
    # then the drag left across the blade at cut feed. Afterwards the
    # stub is pulled back out of the extruder and the head leaves the corner.
    {% set g = printer["gcode_macro _IFS_CUT"] %}
    {% set p = printer.ifs.params %}
    G90
    G92 E0
    # ONE hold across the whole cut, including the blade moves themselves.
    # Severing the filament is the biggest present-to-absent step
    # there is, and on a sensor declared pause_on_runout it fires a runout.
    # Measured: a soak run paused itself here, mid-cut, on a machine that was
    # not printing - "// action:paused" with nothing wrong.
    _IFS_SENSOR_HOLD
    {% if p.cut_before_mm %}
        G1 E-{p.cut_before_mm} F{p.unload_speed}
        M400
    {% endif %}

    G1 X{g.clear_x} F12000
    M400
    G1 Y{g.cut_y} F6000
    M400
    G1 X{g.cut_x} F600
    M400

    G92 E0
    G1 E-{p.cut_after_mm} F{p.unload_speed}
    G1 X{g.clear_x} F6000
    M400
    _IFS_SENSOR_RESUME
    G92 E0


[gcode_macro _IFS_CLEAR_EXTRUDER]
description: Cut and withdraw whatever filament the extruder is holding. TEMP= SLOT=
gcode:
    # Each lane has its OWN bowden the whole way -
    # there is no shared tube on an AD5X - so the hub, which is mounted on the
    # toolhead, and the extruder behind it are the only parts two lanes share.
    # That makes them the only places one lane's filament can block another,
    # and a stub left in the extruder blocks every lane at once.
    {% set p = printer.ifs.params %}
    {% set temp = params.TEMP|default(printer.extruder.target)|float %}
    # Which lane owns the strand being withdrawn, so the IFS can pull with the
    # extruder instead of being dragged by it. Absent when nothing is on record
    # and all we can do is empty the extruder.
    {% set slot = params.SLOT|default(0)|int %}
    {% if temp < 150 %}
        {action_raise_error("_IFS_CLEAR_EXTRUDER needs TEMP= (or a nozzle target); got %.0f" % temp)}
    {% endif %}

    # Nothing in the extruder means nothing to clear.
    {% if printer["filament_switch_sensor toolhead"].filament_detected %}
        M104 S{temp|int}
        {% if printer.extruder.temperature < temp - 2 %}
            # A cold nozzle heats up parked over the chute, so everything a
            # heat-up oozes drops into the bin instead of onto the bed. An
            # already-hot nozzle crosses the whole machine for nothing that
            # way - straight to the cutter.
            _IFS_PARK_FOR_PURGE
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={(temp - 2)|int}
        {% endif %}

        _IFS_CUT
        _IFS_WIPE

        _IFS_PARK_FOR_PURGE
        G92 E0
        _IFS_SENSOR_HOLD
        # The extruder and the lane pull the SAME strand, so they move together
        # or they fight - the mirror of the co-push in _IFS_PURGE. Pulling
        # 60mm back through a lane that is
        # released and not driving drags the filament against the idle drive,
        # and a lane that comes out of a swap buckled will not feed OR retract
        # afterwards - which reads as a dead lane and is not one.
        # G1 is queued and returns immediately, so the retract below runs
        # alongside it rather than after it.
        {% if slot >= 1 %}
            IFS_CLAMP CHANNEL={slot}
        {% endif %}
        G1 E-{p.unload_extruder_mm} F{p.unload_speed}
        {% if slot >= 1 %}
            IFS_RETRACT CHANNEL={slot} UNTIL=done LENGTH={p.unload_extruder_mm} SPEED={p.unload_speed}
        {% endif %}
        M400
        _IFS_SENSOR_RESUME
        G92 E0
        RESPOND PREFIX="info" MSG="IFS: extruder cleared"
    {% else %}
        RESPOND PREFIX="info" MSG="IFS: extruder already empty"
    {% endif %}


[gcode_macro IFS_AUTOINSERT]
description: Thread a freshly inserted lane up to the toolhead. CHANNEL=
gcode:
    # Runs automatically the moment the board reports filament pushed into a
    # lane. It is what puts a lane in a
    # KNOWN position: without it every lane sits wherever a human left it, and
    # a later load has to guess how far away the toolhead is.
    {% set ch = params.CHANNEL|int %}
    {% set p = printer.ifs.params %}
    {% set v = printer.save_variables.variables %}
    # Whoever owns the shared path: a lane threaded up to the hub, or one loaded
    # all the way through the extruder. Either way only ONE lane fits.
    {% set at_hub = v.ifs_at_hub|default(0)|int %}
    {% set occupied = printer["filament_switch_sensor toolhead"].filament_detected %}

    {% if ch not in printer.ifs.loaded_channels %}
        {action_raise_error("IFS lane %d has no filament to insert" % ch)}
    {% endif %}

    # Klipper macros have no finally, so an error between a hold and its resume
    # leaves the toolhead sensor muted and the printer running with no runout
    # detection at all - silently, because a muted sensor looks exactly like a
    # sensor with filament in front of it. Every public entry point starts by
    # restoring it, so a failed command cannot poison the next one.
    # _IFS_SENSOR_RESUME is idempotent.
    _IFS_SENSOR_RESUME
    {% if occupied or (at_hub and at_hub != ch) %}
        # Somebody else is in the shared path, but this lane's own bowden is
        # not shared: thread it to just short of the hub, so its next load
        # feeds the last stretch instead of the whole run. The stop distance
        # leaves the hub and everything past it to the lane that owns it -
        # feeding all the way to the hub packs it against that lane, which is
        # how three lanes once jammed at once. SOFT=1: if the run is ever
        # tighter than measured, the feed stops and the lane stays threaded.
        RESPOND PREFIX="info" MSG="IFS: lane {ch} threaded to near-hub, lane {at_hub if at_hub else 0} holds the shared path"
        IFS_CLAMP CHANNEL={ch}
        IFS_FEED CHANNEL={ch} UNTIL=done SOFT=1 LENGTH={printer["gcode_macro _IFS_GEOMETRY"].insert_advance_mm} SPEED={p.ifs_speed}
        IFS_STOP
        IFS_MARK_INSERTED CHANNEL={ch}
        IFS_RELEASE CHANNEL={ch}
    {% else %}
        RESPOND PREFIX="info" MSG="IFS: threading lane {ch}"
        # Same claim-before-entering rule as IFS_LOAD: a threading feed that
        # stalls leaves the lane in the path, and it has to be on record.
        SAVE_VARIABLE VARIABLE=ifs_at_hub VALUE={ch}
        IFS_CLAMP CHANNEL={ch}
        # Nothing in the shared path: drive until the toolhead sensor sees the
        # tip, then back off so it rests below the gear instead of inside it.
        # UNTIL=toolhead fails if the board finishes without the sensor seeing
        # anything, so reaching here means the tip IS at the sensor and the
        # back-off is unconditional.
        # BACKOFF, not a following IFS_RETRACT: a klipper macro is rendered
        # ONCE, before any of it runs, so nothing written after this line can
        # look at whether the feed reached the sensor - that read already
        # happened. The feed itself backs off, and only if the sensor is what
        # ended it.
        IFS_FEED CHANNEL={ch} UNTIL=toolhead CHECK=1 BACKOFF={p.autoinsert_ret_mm} LENGTH={p.load_empty_mm} SPEED={p.ifs_speed}
        IFS_STOP
        IFS_MARK_INSERTED CHANNEL={ch}
        IFS_RELEASE CHANNEL={ch}
        RESPOND PREFIX="info" MSG="IFS: lane {ch} threaded"
    {% endif %}


##
## Print end on an IFS machine: the base sequence retracts and lifts, and
## then the head parks over the purge chute, so whatever the nozzle drips
## at temperature lands in the bin instead of on the bed or the part.
[gcode_macro END_PRINT]
rename_existing: _END_PRINT_BASE
gcode:
    _END_PRINT_BASE
    {% if printer.save_variables.variables.ifs_loaded|default(0)|int %}
        _IFS_GOTO_STATION X={printer["gcode_macro _IFS_GEOMETRY"].chute_x}
    {% endif %}


[gcode_macro IFS_UNLOAD]
description: Take filament out of the NOZZLE; the lane stays threaded. SLOT= TEMP=
gcode:
    # UNLOAD takes filament out of the nozzle. EJECT takes it out of the
    # machine. They differ only in how far the lane retreats afterwards, and
    # confusing them is expensive: an eject in a tool change pushes the outgoing
    # lane clear out of the IFS and somebody has to re-thread it by hand.
    #
    #   IFS_UNLOAD   70mm    lane stays threaded, ready for the next load
    #   IFS_EJECT  1000mm    lane leaves the IFS entirely, spool change
    {% set slot = params.SLOT|default(printer.save_variables.variables.ifs_loaded|default(0))|int %}
    {% set p = printer.ifs.params %}
    # The material's own handling temperature when none is given. The table
    # lives in [ifs_materials] and nowhere else; this is a lookup, not a copy.
    {% set slots = (printer.ifs_materials|default({})).slots|default({}) %}
    {% set temp = params.TEMP|default(slots.get(slot|string, {}).temp|default(printer.extruder.target, true), true)|float %}

    {% if slot < 1 %}
        {action_raise_error("IFS_UNLOAD needs SLOT= (nothing is currently loaded)")}
    {% endif %}
    {% if temp < 150 %}
        # Cold filament snaps off in the heatbreak instead of coming out.
        {action_raise_error("IFS_UNLOAD needs TEMP= (or a nozzle target); got %.0f" % temp)}
    {% endif %}

    # Klipper macros have no finally, so an error between a hold and its resume
    # leaves the toolhead sensor muted and the printer running with no runout
    # detection at all - silently, because a muted sensor looks exactly like a
    # sensor with filament in front of it. Every public entry point starts by
    # restoring it, so a failed command cannot poison the next one.
    # _IFS_SENSOR_RESUME is idempotent.
    _IFS_SENSOR_RESUME
    RESPOND PREFIX="info" MSG="IFS: unloading slot {slot}"
    # The extruder side goes first - cut, wipe, withdraw the stub. Retracting
    # the lane while the gear still grips the filament only fights it.
    _IFS_CLEAR_EXTRUDER TEMP={temp|int} SLOT={slot}
    IFS_CLAMP CHANNEL={slot}
    IFS_RETRACT CHANNEL={slot} LENGTH={p.unload_ifs_mm} SPEED={p.ifs_speed} UNTIL=done
    IFS_RELEASE CHANNEL={slot}
    IFS_STOP
    SAVE_VARIABLE VARIABLE=ifs_loaded VALUE=0
    SAVE_VARIABLE VARIABLE=ifs_at_hub VALUE=0
    RESPOND PREFIX="info" MSG="IFS: slot {slot} unloaded"


[gcode_macro IFS_LOAD]
description: Load filament from an IFS slot into the nozzle. SLOT= TEMP=
gcode:
    {% set slot = params.SLOT|int %}
    {% set ifs = printer.ifs %}
    {% set p = ifs.params %}
    {% set current = printer.save_variables.variables.ifs_loaded|default(0)|int %}
    {% set at_hub = printer.save_variables.variables.ifs_at_hub|default(0)|int %}

    # What the slot holds, and what that material wants to be pushed at. The
    # slot type comes from FlashForge's own file, so this is the same answer
    # the stock UI would give. TEMP= still wins - a user who says 240 means it.
    {% set slots = (printer.ifs_materials|default({})).slots|default({}) %}
    {% set incoming = slots.get(slot|string, {}) %}
    {% set outgoing = slots.get(current|string, {}) %}
    # Priority: an explicit TEMP=, then the material's own handling temperature,
    # then whatever the nozzle is already aiming at. A hot nozzle mid-print is
    # last, not first: it is the print's number, not the filament's.
    # default(x, true) throughout: an unlabelled slot's temp is None, not
    # missing, and plain default() only substitutes for missing.
    {% set temp = params.TEMP|default(incoming.temp|default(printer.extruder.target, true), true)|float %}

    # A different MATERIAL, not merely a different colour, needs more flushed
    # through. Both types have to be known:
    # comparing against an unknown outgoing type would add the length on every
    # load of a machine whose slots are unlabelled.
    {% set changed = incoming.type and outgoing.type and incoming.type != outgoing.type %}
    {% set purge_extra = p.purge_extra_mm if changed else 0.0 %}

    {% if not ifs.connected %}
        {action_raise_error("IFS is not connected: %s" % (ifs.error or "no reason recorded"))}
    {% endif %}
    {% if slot not in ifs.loaded_channels %}
        # The board refuses to feed an empty lane anyway ("FFS not ready."),
        # but saying so here is clearer than a failed opcode.
        {action_raise_error("IFS slot %d has no filament" % slot)}
    {% endif %}
    {% if temp < 150 %}
        # min_extrude_temp is 0 on this printer, so klipper will NOT refuse a
        # cold extrude. Nothing below this macro enforces it.
        {action_raise_error("IFS_LOAD needs TEMP= (or a nozzle target); got %.0f" % temp)}
    {% endif %}

    # Klipper macros have no finally, so an error between a hold and its resume
    # leaves the toolhead sensor muted and the printer running with no runout
    # detection at all - silently, because a muted sensor looks exactly like a
    # sensor with filament in front of it. Every public entry point starts by
    # restoring it, so a failed command cannot poison the next one.
    # _IFS_SENSOR_RESUME is idempotent.
    _IFS_SENSOR_RESUME
    RESPOND PREFIX="info" MSG="IFS: loading slot {slot}"
    M104 S{temp|int}

    # A load starts by getting the previous filament out of the way. The hub
    # and the extruder are shared by all four lanes, so filament left in them
    # stops the incoming lane dead - it simply pushes against it and the IFS
    # stalls.
    #
    # When the loaded lane is known, that means a FULL unload: the strand is
    # pulled back into its own IFS lane. Clearing only the extruder leaves it sitting
    # at the hub, which is where the next lane arrives. When no lane is on
    # record there is nothing to retract and emptying the extruder is all we
    # can do; both are no-ops when the toolhead sensor is already clear.
    {% if current >= 1 %}
        IFS_UNLOAD SLOT={current} TEMP={temp|int}
    {% else %}
        _IFS_CLEAR_EXTRUDER TEMP={temp|int}
    {% endif %}

    # And whoever is merely PARKED at the hub has to give it up too. Only one
    # lane fits in the shared path, and a lane threaded there but never loaded
    # is invisible to the toolhead sensor - it sits 90mm short of it. Feeding
    # into that jams both: measured, lane 4 threaded and parked, then lane 1
    # stalled after exactly the 90mm lane 4 had backed off.
    #
    # MERELY parked is the whole point of the at_hub != current test. A macro
    # is rendered once, before any of it runs, so at_hub still holds what it
    # held on entry - IFS_UNLOAD above has already retracted that same lane and
    # written ifs_at_hub=0, but this block cannot see it. Without the test,
    # every ordinary swap retracted the outgoing lane a second time: 130mm for
    # the unload and then hub_clear_mm on top, 430mm total where the extruder
    # tip is only 150mm above the combiner. That is 280mm of retract and 280mm
    # of re-feed bought for nothing, on every tool change.
    {% if at_hub >= 1 and at_hub != slot and at_hub != current %}
        RESPOND PREFIX="info" MSG="IFS: moving lane {at_hub} out of the shared path"
        IFS_CLAMP CHANNEL={at_hub}
        IFS_RETRACT CHANNEL={at_hub} LENGTH={p.hub_clear_mm} SPEED={p.ifs_speed} UNTIL=done
        IFS_RELEASE CHANNEL={at_hub}
        SAVE_VARIABLE VARIABLE=ifs_at_hub VALUE=0
    {% endif %}

    _IFS_PARK_FOR_PURGE
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={(temp - 2)|int}

    # Claim the shared path BEFORE entering it, not after arriving. A feed that
    # stalls part-way leaves the lane somewhere in the tube, and recording the
    # claim only on success leaves ifs_at_hub=0 with a lane sitting in the path
    # - so the next load of a DIFFERENT lane feeds straight into it. That is
    # the collision that cost a night, reached by a different road.
    #
    # Pessimistic and safe beats accurate and late, and it needs no recovery
    # path of its own: the next load already retracts whoever holds the hub, so
    # an accurate record IS the recovery.
    SAVE_VARIABLE VARIABLE=ifs_at_hub VALUE={slot}
    IFS_CLAMP CHANNEL={slot}
    # The tube length, at IFS speed. This is a bound, not a target: the toolhead
    # sensor ends the feed when filament arrives at the extruder inlet, so a
    # part-fed lane cannot overshoot.
    #
    # An earlier "F10 ... refused: FFS not ready." was blamed on this length and
    # it was not that at all - the feed was arriving before the clamp had
    # settled. 600 was refused exactly as 1000 was.
    #
    # SOFT=1: a stall here must NOT abort the load. The feed ENDS by arriving at
    # the extruder gear, and the IFS cannot push filament past a gear that is
    # not turning - _IFS_PURGE's own comment says exactly that. So stopping
    # short is how this feed finishes, not a fault, and the co-push below is
    # what completes the load. Raising instead aborts the load before the one
    # step that can finish it - and reads as a mechanical fault that is not there.
    #
    # The success test moves to IFS_REQUIRE_TOOLHEAD after the purge, where the
    # sensor can finally answer it. Arriving at the gear and never arriving at
    # all end this feed identically; only the extruder can tell them apart.
    IFS_FEED CHANNEL={slot} UNTIL=toolhead CHECK=1 SOFT=1 LENGTH={p.tube_mm} SPEED={p.ifs_speed}
    IFS_STOP

    # The lane keeps driving through the first purge pass; _IFS_PURGE releases
    # it when the extruder has the filament.
    {% if changed %}
        RESPOND PREFIX="info" MSG="IFS: {outgoing.type} to {incoming.type}, purging {p.purge_extra_mm|int}mm more per pass"
    {% endif %}
    _IFS_PURGE SLOT={slot} EXTRA={purge_extra}
    # NOW ask whether the load worked. The feed above cannot say; only the
    # sensor at the toolhead can, and asking earlier would have no answer.
    IFS_REQUIRE_TOOLHEAD
    # Tell the board the lane is occupied - the acknowledgement that clears
    # its insert-request bit.
    IFS_MARK_INSERTED CHANNEL={slot}
    # Nothing else knows which lane is in the nozzle.
    # ifs_at_hub was already claimed above; only this one waits for success,
    # because "in the nozzle" is the thing that is not true until it is.
    SAVE_VARIABLE VARIABLE=ifs_loaded VALUE={slot}
    RESPOND PREFIX="info" MSG="IFS: slot {slot} loaded"

## Tool selection, the way a slicer writes it.
##
## A multi-material file is a stream of `T0`..`T3`, and klipper runs a
## gcode_macro of that name synchronously in the gcode stream - which is
## exactly the blocking behaviour a tool change needs - no intercepted
## gcode stream, no polling loop, no deadlock when a flag is never cleared.
##
## Numbering is the slicer's: T0 is the first extruder, our lanes start at 1.
[gcode_macro T0]
description: Select IFS slot 1 (slicer tool 0)
gcode:
    IFS_SELECT SLOT=1

[gcode_macro T1]
description: Select IFS slot 2 (slicer tool 1)
gcode:
    IFS_SELECT SLOT=2

[gcode_macro T2]
description: Select IFS slot 3 (slicer tool 2)
gcode:
    IFS_SELECT SLOT=3

[gcode_macro T3]
description: Select IFS slot 4 (slicer tool 3)
gcode:
    IFS_SELECT SLOT=4


[gcode_macro IFS_EJECT]
description: Pull filament all the way back OUT of the IFS. SLOT= TEMP=
gcode:
    # The whole tube at IFS speed, which pushes the filament clear of the lane
    # so a spool can be changed. This is NOT what a
    # tool change wants - see IFS_UNLOAD.
    {% set slot = params.SLOT|default(printer.save_variables.variables.ifs_loaded|default(0))|int %}
    {% set p = printer.ifs.params %}
    {% set loaded = printer.save_variables.variables.ifs_loaded|default(0)|int %}
    {% set at_hub = printer.save_variables.variables.ifs_at_hub|default(0)|int %}
    {% set slots = (printer.ifs_materials|default({})).slots|default({}) %}
    {% set temp = params.TEMP|default(slots.get(slot|string, {}).temp|default(printer.extruder.target, true), true)|float %}

    {% if slot < 1 %}
        {action_raise_error("IFS_EJECT needs SLOT=")}
    {% endif %}

    # Klipper macros have no finally, so an error between a hold and its resume
    # leaves the toolhead sensor muted and the printer running with no runout
    # detection at all - silently, because a muted sensor looks exactly like a
    # sensor with filament in front of it. Every public entry point starts by
    # restoring it, so a failed command cannot poison the next one.
    # _IFS_SENSOR_RESUME is idempotent.
    _IFS_SENSOR_RESUME
    RESPOND PREFIX="info" MSG="IFS: ejecting slot {slot}"
    # Only the lane that is actually in the nozzle needs the extruder emptied,
    # and only that case needs heat. Ejecting an idle lane works cold.
    {% if slot == loaded %}
        {% if temp < 150 %}
            {action_raise_error("IFS_EJECT of the loaded slot needs TEMP= (or a nozzle target); got %.0f" % temp)}
        {% endif %}
        _IFS_CLEAR_EXTRUDER TEMP={temp|int} SLOT={slot}
        SAVE_VARIABLE VARIABLE=ifs_loaded VALUE=0
        SAVE_VARIABLE VARIABLE=ifs_at_hub VALUE=0
    {% endif %}

    IFS_CLAMP CHANNEL={slot}
    IFS_RETRACT CHANNEL={slot} LENGTH={p.tube_mm} SPEED={p.ifs_speed} UNTIL=done
    IFS_RELEASE CHANNEL={slot}
    IFS_STOP
    # An eject pulls the lane out of the machine entirely, so a claim on the
    # shared path cannot outlive it. The loaded branch above clears both
    # records as a pair; this catches the OTHER case, a lane parked at the hub
    # but never loaded - which is exactly what a failed load leaves behind.
    # Measured: ejecting a parked lane 1 left ifs_at_hub=1 with the filament
    # on the bench, and the next insert of lane 4 was refused by a lane that
    # was not in the printer.
    #
    # After the retract, not before: a retract that fails part-way leaves the
    # lane somewhere in the tube, and the claim is still true then.
    {% if at_hub == slot and slot != loaded %}
        SAVE_VARIABLE VARIABLE=ifs_at_hub VALUE=0
    {% endif %}
    RESPOND PREFIX="info" MSG="IFS: slot {slot} ejected"

[gcode_macro IFS_PURGE]
description: Purge the loaded lane through the nozzle at the chute. TEMP=
gcode:
    # Park over the chute and run the extruder-only pass, with no lane driving,
    # then shake and wipe. Useful on its own when a colour has not fully
    # changed over.
    {% set p = printer.ifs.params %}
    {% set slot = printer.save_variables.variables.ifs_loaded|default(0)|int %}
    {% set slots = (printer.ifs_materials|default({})).slots|default({}) %}
    {% set temp = params.TEMP|default(slots.get(slot|string, {}).temp|default(printer.extruder.target, true), true)|float %}

    {% if slot < 1 %}
        {action_raise_error("IFS_PURGE needs a loaded lane; nothing is loaded")}
    {% endif %}
    {% if temp < 150 %}
        {action_raise_error("IFS_PURGE needs TEMP= (or a nozzle target); got %.0f" % temp)}
    {% endif %}

    # See IFS_LOAD: a leaked mute must not survive into the next command, and
    # this parks the head before it reaches _IFS_PURGE's own heal.
    _IFS_SENSOR_RESUME
    RESPOND PREFIX="info" MSG="IFS: purging slot {slot}"
    M104 S{temp|int}
    _IFS_PARK_FOR_PURGE
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={(temp - 2)|int}
    # SLOT is deliberately omitted: the lane is already through the gear, so
    # this is the extruder's job alone.
    _IFS_PURGE
    RESPOND PREFIX="info" MSG="IFS: slot {slot} purged"


[gcode_macro IFS_MOTION]
description: Say whether the loaded lane jammed or simply ran out
gcode:
    # Filament stopping is the same event either way; what tells the two apart
    # is whether the LANE still
    # holds filament. If it does, something is stuck and the print has to stop.
    # If it does not, the spool is finished, which is an ordinary thing that the
    # runout sensor is already handling - saying "jam" there sends somebody
    # looking for a blockage that is not real.
    {% set slot = printer.save_variables.variables.ifs_loaded|default(0)|int %}

    {% if slot < 1 %}
        RESPOND PREFIX="info" MSG="IFS: no lane is loaded, so nothing has stopped"
    {% elif slot in printer.ifs.loaded_channels %}
        RESPOND TYPE=error MSG="IFS: filament jam - lane {slot} still has filament but it stopped moving"
        # Only a print can be paused. Run from the console this is a question,
        # not an emergency, and pausing a printer that is standing idle just
        # leaves a paused state for somebody to find and clear.
        {% if printer.print_stats.state == "printing" %}
            PAUSE
        {% endif %}
    {% else %}
        RESPOND PREFIX="info" MSG="IFS: lane {slot} has run out"
    {% endif %}


[gcode_macro IFS_SELECT]
description: Switch to a different IFS slot, mid-print or idle. SLOT= TEMP=
# -1000 is the "nothing saved" sentinel: a real coordinate can be negative
# (the cutter lives at X-2.5 Y-7.5) but never this far out.
variable_restore_x: -1000
variable_restore_y: -1000
variable_restore_z: -1000
variable_restore_temp: 0
variable_restore_fan: 0
gcode:
    # A tool change is a LOAD - the load already takes the previous filament
    # out of the nozzle - wrapped in the save/restore a print needs. What
    # a swap DURING A PRINT adds is putting everything back afterwards.
    {% set slot = params.SLOT|int %}
    {% set current = printer.save_variables.variables.ifs_loaded|default(0)|int %}
    # print_stats, not idle_timeout: idle_timeout reads "Printing" for any
    # command that moves the machine, including this one.
    {% set printing = printer.print_stats.state == "printing" %}
    {% set pos = printer.gcode_move.gcode_position %}

    {% if current == slot %}
        RESPOND PREFIX="info" MSG="IFS: slot {slot} is already selected"
    {% else %}
        # Lift the bed 5 mm, ONCE, before any travel: enough to clear the part
        # on the way off the bed, and low enough that the back-edge stations
        # are entered below the wall hardware. The stations themselves never
        # lift - bigger station-side lifts clip the back wall and stack per
        # visit. Guarded on a homed Z: a Z move on an unhomed axis raises, and
        # _IFS_GOTO_STATION below homes anyway when needed.
        {% if "z" in printer.toolhead.homed_axes %}
            MOVE_SAFE Z={printer["gcode_macro _IFS_GEOMETRY"].lift_dz} F=1500 ABSOLUTE=0
            M400
        {% endif %}
        {% if printing %}
            # gcode_position, not toolhead.position: the print works in
            # offset-applied coordinates and has to come back to the same ones.
            SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_x VALUE={pos.x}
            SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_y VALUE={pos.y}
            SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_z VALUE={pos.z}
            # The PRINT's temperature. The load is about to replace it with the
            # incoming material's handling temperature, which is a different
            # number and not the one the slicer chose.
            SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_temp VALUE={printer.extruder.target}
            SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_fan VALUE={printer["fan_generic fanM106"].speed}
            # The purge runs M83 and G92 E0. Without this the print's extrusion
            # accounting continues from the purge's zero and the next G1 E means
            # something else entirely.
            SAVE_GCODE_STATE NAME=ifs_tool_change
        {% endif %}

        {% if params.TEMP is defined %}
            IFS_LOAD SLOT={slot} TEMP={params.TEMP}
        {% else %}
            # No TEMP passed through rather than a resolved one: IFS_LOAD knows
            # what the slot's material wants, and forwarding
            # printer.extruder.target here would hand it a hard 0 off a cold
            # nozzle and shadow that lookup.
            IFS_LOAD SLOT={slot}
        {% endif %}

        {% if printing %}
            _IFS_RESTORE_AFTER_CHANGE
        {% endif %}
    {% endif %}


[gcode_macro _IFS_RESTORE_AFTER_CHANGE]
description: Put the print back the way the tool change found it
gcode:
    # Reads variables IFS_SELECT set, which is why this is its own macro: a
    # klipper gcode_macro is rendered ONCE before any of it runs, so IFS_SELECT
    # cannot read back a SET_GCODE_VARIABLE it issues itself.
    {% set v = printer["gcode_macro IFS_SELECT"] %}
    {% set g = printer["gcode_macro _IFS_GEOMETRY"] %}

    {% if v.restore_x < -900 %}
        # The sentinel. Nothing was saved, so there is nothing to put back and
        # moving to -1000 would be a crash into the frame.
        {action_raise_error("_IFS_RESTORE_AFTER_CHANGE has no saved position")}
    {% endif %}

    RESPOND PREFIX="info" MSG="IFS: back to X{v.restore_x} Y{v.restore_y} Z{v.restore_z}"
    # Off the back edge FIRST. X may not travel while the head is behind
    # safe_y - that is where the wall hardware is - and _IFS_WIPE leaves us at
    # the pad. Same rule as the outbound trip, in reverse.
    _IFS_LEAVE_PURGE
    G90
    G1 X{v.restore_x} F12000
    G1 Y{v.restore_y} F12000
    M400
    # Z last, so every one of those travels happened at the height the outbound
    # _IFS_GOTO_STATION lifted to rather than skimming the part.
    G1 Z{v.restore_z} F1500
    M400

    # The print's own temperature back, and WAIT for it: the load left the
    # nozzle at the material's handling temperature and the next extrusion is
    # the slicer's, at the slicer's number.
    {% if v.restore_temp|float >= 150 %}
        M104 S{v.restore_temp|int}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={(v.restore_temp|float - 2)|int}
    {% endif %}
    # The purge drives the part fan to full and then off; the print wants what
    # it had.
    SET_FAN_SPEED FAN=fanM106 SPEED={v.restore_fan}

    # Extrusion mode, offsets and E position, restored LAST and with MOVE=0 -
    # the moves above already put the head where it belongs, and MOVE=1 here
    # would send it on a second, diagonal trip to get there.
    RESTORE_GCODE_STATE MOVE=0 NAME=ifs_tool_change

    # Clear the sentinel so a second restore cannot replay a stale position.
    SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_x VALUE=-1000
    SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_y VALUE=-1000
    SET_GCODE_VARIABLE MACRO=IFS_SELECT VARIABLE=restore_z VALUE=-1000
