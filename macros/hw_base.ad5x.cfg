##
## AD5X override for hw_base.cfg. AD5X stock hardware omits the AD5M
## sections:
##   - [temperature_sensor weightValue]: the AD5X has no load-cell/weight
##     temperature sensor (its load cell is a plain [probe]).
##   - [gcode_macro G17/G18/G19]: AD5X's newer stock gcode_arcs.py already
##     registers G17/G18/G19, so redefining them collides.
##   - [load_cell_tare]: the AD5M default hw_base.cfg carries this section;
##     its plugin looks up [temperature_sensor weightValue] and
##     [gcode_button check_level_pin] on klippy:ready, both AD5X-absent, so
##     the plugin would abort at ready. AD5X omits the section (plugin never
##     loads) and provides the no-op LOAD_CELL_TARE macro below instead.
##
## The AD5X's 4-channel filament system lives in ifs.cfg - a self-contained
## module whose macros and plugins need nothing from this file.
##

# The AD5M load-cell tare plugin is not loaded on AD5X (no [load_cell_tare]
# section above). AD5X uses the stock !PB3 load-cell probe directly and its
# callers do their own probing, so LOAD_CELL_TARE has nothing to do here. This
# no-op keeps the shared CLEAR_NOZZLE / _CHECK_BED_MESH / _START_PRINT call
# sites working with no motion. It accepts and ignores any params the call
# sites pass.
#
# The load cell's zero cannot be re-tared from the host on this machine: the
# tare pin protocol is AD5M-only wiring, and the AD5X's zero lives in the
# toolboard firmware behind the probe's digital line.
[gcode_macro LOAD_CELL_TARE]
description: No-op on AD5X (stock !PB3 probe; callers probe directly)
gcode:
    # Intentionally empty: AD5X has no host-side load-cell tare hardware.


##
## Air circulation on this machine: one fan, no damper.
##
## The shared AIR_CIRCULATION macros drive the AD5M's enclosure - internal and
## external fans plus a damper servo routing between them. The AD5X is
## open-frame stock; the enclosure kit brings one circulation fan on PB7 and
## no damper, so there is no path to route between. Both modes run that fan
## and say so; STOP stops it. On a machine without the kit the fan object
## drives an unconnected header and nothing happens.
[gcode_macro _AIR_CIRCULATION_INTERNAL_BASE]
rename_existing: AIR_CIRCULATION_INTERNAL
gcode:

[gcode_macro _AIR_CIRCULATION_EXTERNAL_BASE]
rename_existing: AIR_CIRCULATION_EXTERNAL
gcode:

[gcode_macro _AIR_CIRCULATION_STOP_BASE]
rename_existing: AIR_CIRCULATION_STOP
gcode:

[gcode_macro AIR_CIRCULATION_INTERNAL]
description: Run the circulation fan (single fan, no damper on AD5X)
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1
    RESPOND PREFIX="info" MSG="AD5X: circulation fan on (no damper fitted)"

[gcode_macro AIR_CIRCULATION_EXTERNAL]
description: Run the circulation fan (single fan, no damper on AD5X)
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1
    RESPOND PREFIX="info" MSG="AD5X: circulation fan on (no damper fitted)"

[gcode_macro AIR_CIRCULATION_STOP]
description: Stop the circulation fan
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0


[include ifs.cfg]
